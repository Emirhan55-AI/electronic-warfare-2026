<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./maplibre/maplibre-gl.css">
  <style>
    html, body, #map, #fallback { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101820; color: #d8e7f4; font: 13px "Segoe UI", sans-serif; }
    #fallback { display: none; position: absolute; inset: 0; background: #101820; }
    #fallback canvas { width: 100%; height: 100%; }
    #map-message { position: absolute; z-index: 4; left: 14px; top: 14px; max-width: 430px; padding: 8px 10px; background: rgba(11, 24, 34, .86); border-left: 3px solid #55d6be; color: #d8e7f4; pointer-events: none; }
    .sensor-marker { width: 20px; height: 20px; border: 3px solid #f6fbff; border-radius: 50%; box-sizing: border-box; background: #3a9dff; box-shadow: 0 0 0 4px rgba(58,157,255,.22); position: relative; }
    .maplibregl-ctrl-group { background: #172735; }
    .maplibregl-ctrl-group button { background-color: #172735; }
    .maplibregl-ctrl-group button span { filter: invert(1); }
    .maplibregl-popup-content { background: #172735; color: #d8e7f4; max-width: 280px; }
    .maplibregl-popup-tip { border-top-color: #172735 !important; }
    .popup-title { font-weight: 700; margin-bottom: 6px; color: #55d6be; }
    .popup-row { margin: 2px 0; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="fallback"><canvas id="fallback-canvas"></canvas></div>
  <div id="map-message">Harita hazırlanıyor…</div>
  <script src="./maplibre/maplibre-gl.js"></script>
  <script src="./pmtiles/pmtiles.js"></script>
  <script>
    window.pendingMapPayload = null;
    window.updateMapPayload = function(payload) { window.pendingMapPayload = payload; };
  </script>
  <script>
    let payload = window.pendingMapPayload;
    let providerIndex = 0;
    let map = null;
    let marker = null;
    let googleMap = null;
    let googleMarker = null;
    let googleLine = null;
    let mapReady = false;
    let pmtilesRegistered = false;

    const mapNode = document.getElementById("map");
    const fallbackNode = document.getElementById("fallback");
    const messageNode = document.getElementById("map-message");

    function popupHtml(data) {
      const p = data.presentation;
      return `<div class="popup-title">Sensör</div>` +
        `<div class="popup-row">Enlem: ${p.sensor.latitude.toFixed(6)}°</div>` +
        `<div class="popup-row">Boylam: ${p.sensor.longitude.toFixed(6)}°</div>` +
        `<div class="popup-row">Coğrafi referans: ${p.sensor.heading === null ? "Referans yok" : p.sensor.heading.toFixed(1) + "°"}</div>` +
        `<div class="popup-row">Konum kaynağı: ${p.sensor.source}</div>` +
        `<div class="popup-row">Bağıl anten açısı: ${p.relativeAngle.toFixed(1)}°</div>` +
        `<div class="popup-row">Coğrafi azimut: ${p.azimuth === null ? "Referans yok" : p.azimuth.toFixed(1) + "°"}</div>` +
        `<div class="popup-row">Frekans: ${p.frequency}</div>` +
        `<div class="popup-row">Güç: ${p.power}</div>` +
        `<div class="popup-row">Ölçüm güveni: ${p.confidence}</div>` +
        `<div class="popup-row">Kaynak: ${p.source}</div>` +
        `<div class="popup-row">Zaman: ${p.timestamp}</div>`;
    }

    function setMessage(text) { messageNode.textContent = text; }

    function destroyEngines() {
      if (map) { map.remove(); map = null; }
      marker = null;
      mapNode.innerHTML = "";
      googleMap = null; googleMarker = null; googleLine = null;
      mapReady = false;
    }

    function drawFallback() {
      destroyEngines();
      mapNode.style.display = "none";
      fallbackNode.style.display = "block";
      const canvas = document.getElementById("fallback-canvas"), scale = devicePixelRatio || 1;
      const width = canvas.clientWidth, height = canvas.clientHeight;
      canvas.width = width * scale; canvas.height = height * scale;
      const ctx = canvas.getContext("2d"); ctx.setTransform(scale,0,0,scale,0,0);
      ctx.fillStyle = "#101820"; ctx.fillRect(0,0,width,height);
      ctx.fillStyle = "#d8e7f4"; ctx.font = "15px Segoe UI";
      ctx.fillText("Harita verisi kullanılamıyor", 24, 36);
      ctx.fillStyle = "#8ba5b7"; ctx.fillText("Yön bilgisi metinsel olarak görüntüleniyor.", 24, 60);
      setMessage("Harita motoru kullanılamıyor. Yön bilgisi metinsel olarak görüntüleniyor.");
    }

    function makeFeatures() {
      const p = payload.presentation;
      const features = [];
      if (p.lob) {
        features.push({ type: "Feature", properties: { kind: "lob" }, geometry: { type: "LineString", coordinates: p.lob.line } });
        features.push({ type: "Feature", properties: { kind: "arrow" }, geometry: { type: "Polygon", coordinates: [p.lob.arrowhead] } });
      }
      for (const ray of (p.rays || [])) {
        features.push({ type: "Feature", properties: { kind: "ray", color: ray.color }, geometry: { type: "LineString", coordinates: ray.line } });
        features.push({ type: "Feature", properties: { kind: "ray-arrow", color: ray.color }, geometry: { type: "Polygon", coordinates: [ray.arrowhead] } });
      }
      return { type: "FeatureCollection", features: features };
    }

    function updateMapLibre() {
      if (!map || !mapReady || !payload) return;
      const p = payload.presentation;
      const point = [p.sensor.longitude, p.sensor.latitude];
      const rays = p.rays || [];
      if (rays.length) {
        const bounds = new maplibregl.LngLatBounds(point, point);
        for (const ray of rays) for (const coordinate of ray.line) bounds.extend(coordinate);
        map.fitBounds(bounds, { padding: 96, maxZoom: 15, duration: 0 });
      } else {
        map.jumpTo({ center: point, zoom: payload.zoom, bearing: 0, pitch: 0 });
      }
      const source = map.getSource("df-lob");
      if (source) source.setData(makeFeatures());
      if (!marker) {
        const node = document.createElement("div"); node.className = "sensor-marker";
        marker = new maplibregl.Marker({ element: node, anchor: "center" }).setLngLat(point).addTo(map);
        marker.setPopup(new maplibregl.Popup({ offset: 18 }).setHTML(popupHtml(payload)));
      } else {
        marker.setLngLat(point); marker.setPopup(new maplibregl.Popup({ offset: 18 }).setHTML(popupHtml(payload)));
      }
      setMessage(p.azimuth === null ? "Bağıl yön — coğrafi azimut referansı yok" : `${p.source} · Konum: ${p.sensor.source} · Tahmini geliş doğrultusu ${p.azimuth.toFixed(1)}° · yön çizgisi yalnız doğrultudur.`);
    }

    function createMapLibre(provider) {
      if (provider.mode === "OFFLINE_MAP" && !pmtilesRegistered && window.pmtiles) {
        const protocol = new window.pmtiles.Protocol();
        maplibregl.addProtocol("pmtiles", protocol.tile); pmtilesRegistered = true;
      }
      mapNode.style.display = "block"; fallbackNode.style.display = "none";
      map = new maplibregl.Map({ container: mapNode, style: provider.styleUrl, center: [payload.presentation.sensor.longitude, payload.presentation.sensor.latitude], zoom: payload.zoom, bearing: 0, attributionControl: true });
      map.addControl(new maplibregl.NavigationControl({ showCompass: true }), "top-right");
      map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }), "bottom-left");
      map.once("load", () => {
        mapReady = true;
        map.addSource("df-lob", { type: "geojson", data: makeFeatures() });
        map.addLayer({ id: "df-lob-line", type: "line", source: "df-lob", filter: ["match", ["get", "kind"], "lob", true, "ray", true, false], paint: { "line-color": ["coalesce", ["get", "color"], "#55d6be"], "line-width": 4, "line-opacity": .95 } });
        map.addLayer({ id: "df-lob-arrow", type: "fill", source: "df-lob", filter: ["match", ["get", "kind"], "arrow", true, "ray-arrow", true, false], paint: { "fill-color": ["coalesce", ["get", "color"], "#55d6be"], "fill-opacity": .95 } });
        updateMapLibre();
      });
      map.once("error", () => { if (!mapReady) nextProvider(); });
    }

    function loadGoogle(key) {
      return new Promise((resolve, reject) => {
        if (window.google && window.google.maps) { resolve(); return; }
        const script = document.createElement("script");
        script.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key);
        script.async = true; script.onload = resolve; script.onerror = reject; document.head.appendChild(script);
      });
    }

    async function createGoogle(provider) {
      await loadGoogle(provider.googleMapsApiKey);
      mapNode.style.display = "block"; fallbackNode.style.display = "none";
      const p = payload.presentation, point = { lat: p.sensor.latitude, lng: p.sensor.longitude };
      googleMap = new google.maps.Map(mapNode, { center: point, zoom: payload.zoom, mapTypeId: "satellite", streetViewControl: false, mapTypeControl: false, rotateControl: false });
      googleMarker = new google.maps.Marker({ position: point, map: googleMap, title: "Sensör" });
      googleMarker.addListener("click", () => new google.maps.InfoWindow({ content: popupHtml(payload) }).open({ anchor: googleMarker, map: googleMap }));
      if (p.lob) {
        googleLine = new google.maps.Polyline({ path: p.lob.line.map(item => ({ lng: item[0], lat: item[1] })), strokeColor: "#55d6be", strokeWeight: 4, icons: [{ icon: { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 4, strokeColor: "#55d6be" }, offset: "100%" }], map: googleMap });
      }
      setMessage(`${p.source} · Uydu görünümü · yön çizgisi yalnız doğrultudur.`);
    }

    async function nextProvider() {
      destroyEngines(); providerIndex += 1;
      if (!payload || providerIndex >= payload.providers.length) { drawFallback(); return; }
      const provider = payload.providers[providerIndex];
      try {
        if (provider.mode === "FALLBACK_CANVAS") { drawFallback(); return; }
        if (provider.mode === "ONLINE_SATELLITE") await createGoogle(provider);
        else createMapLibre(provider);
      } catch (_) { nextProvider(); }
    }

    async function start() {
      providerIndex = 0;
      if (!payload || !payload.providers.length) { drawFallback(); return; }
      const provider = payload.providers[0];
      try {
        if (provider.mode === "FALLBACK_CANVAS") drawFallback();
        else if (provider.mode === "ONLINE_SATELLITE") await createGoogle(provider);
        else createMapLibre(provider);
      } catch (_) { nextProvider(); }
    }

    window.updateMapPayload = function(next) {
      payload = next;
      if (!map && !googleMap) start();
      else if (map) updateMapLibre();
    };
    if (payload) start();
  </script>
</body>
</html>
